# Rename `app` to whatever `fly launch` gives you — it must be globally unique.
app = "zedventures-test"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero when nobody is looking at it, so a preview site costs
  # essentially nothing. First hit after idle takes a second or two to wake.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
